<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO & Meta -->
  <title>{{TITLE}} - 概念可视化</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:type" content="article">

  <!-- Favicon (Emoji SVG) -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>{{EMOJI}}</text></svg>">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'Consolas', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    /* ===== Design Tokens ===== */
    :root {
      --bg-base: #0a0a0f;
      --bg-surface: #111119;
      --bg-elevated: #1a1a25;
      --bg-overlay: rgba(255, 255, 255, 0.03);
      --bg-hover: rgba(255, 255, 255, 0.06);

      --accent-primary: #6366f1;
      --accent-primary-hover: #818cf8;
      --accent-primary-subtle: rgba(99, 102, 241, 0.12);
      --accent-secondary: #22d3ee;
      --accent-secondary-subtle: rgba(34, 211, 238, 0.12);

      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;

      --border-default: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.15);

      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
      --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.15);
    }

    /* ===== Global Reset ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.7;
    }

    /* ===== Background Decoration ===== */
    .dot-grid {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(var(--accent-primary) 0.5px, transparent 0.5px);
      background-size: 32px 32px;
      opacity: 0.06;
      z-index: 0;
      pointer-events: none;
    }

    .gradient-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-primary-subtle) 0%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
    }

    /* ===== Entry Animations ===== */
    .animate-in {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease-out, transform 0.6s ease-out;
    }

    .animate-in.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .animate-in:nth-child(2) {
      transition-delay: 100ms;
    }

    .animate-in:nth-child(3) {
      transition-delay: 200ms;
    }

    .animate-in:nth-child(4) {
      transition-delay: 300ms;
    }

    .animate-in:nth-child(5) {
      transition-delay: 400ms;
    }

    @media (prefers-reduced-motion: reduce) {
      .animate-in {
        opacity: 1;
        transform: none;
        transition: none;
      }
    }

    /* ===== Card Hover ===== */
    .card-hover {
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .card-hover:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--border-hover);
    }

    /* ===== Scrollbar ===== */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-base);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-default);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--border-hover);
    }

    /* ===== Print ===== */
    @media print {

      .dot-grid,
      .gradient-glow,
      nav,
      #progress-bar {
        display: none !important;
      }

      body {
        background: white;
        color: #1a1a1a;
      }

      .animate-in {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>

<body>
  <!-- Progress Bar -->
  <div class="fixed top-0 left-0 z-[60] h-0.5 bg-[var(--accent-primary)] transition-all duration-150" id="progress-bar"
    style="width: 0%"></div>

  <!-- Background -->
  <div class="dot-grid"></div>

  <!-- Navigation -->
  <nav class="fixed top-0 left-0 right-0 z-50 backdrop-blur-md border-b"
    style="background: rgba(10,10,15,0.8); border-color: var(--border-default);">
    <div class="max-w-6xl mx-auto px-6 flex items-center justify-between h-14">
      <a href="#hero" class="font-bold text-sm" style="color: var(--text-primary);">{{TITLE}}</a>
      <div class="hidden md:flex items-center gap-6">
        <!-- Nav items will be inserted here -->
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main>
    <!-- ===== HERO SECTION ===== -->
    <!-- {{SECTIONS}} -->
  </main>

  <!-- Footer -->
  <footer class="py-16 border-t" style="border-color: var(--border-default);">
    <div class="max-w-6xl mx-auto px-6 text-center">
      <p class="text-sm" style="color: var(--text-muted);">
        由 <span style="color: var(--accent-primary);">一目了然</span> 生成
      </p>
    </div>
  </footer>

  <!-- Scripts -->
  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Intersection Observer for animations
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

    document.querySelectorAll('.animate-in').forEach(el => observer.observe(el));

    // Scroll Progress Bar
    window.addEventListener('scroll', () => {
      const scrollTop = document.documentElement.scrollTop;
      const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
      const progress = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
      document.getElementById('progress-bar').style.width = progress + '%';
    });

    // Counter Animation
    function animateCounter(el, target, duration = 2000) {
      let start = 0;
      const increment = target / (duration / 16);
      const suffix = el.dataset.suffix || '';
      const prefix = el.dataset.prefix || '';
      function update() {
        start += increment;
        if (start >= target) {
          el.textContent = prefix + target.toLocaleString() + suffix;
          return;
        }
        el.textContent = prefix + Math.floor(start).toLocaleString() + suffix;
        requestAnimationFrame(update);
      }
      update();
    }

    // Initialize counters on visibility
    const counterObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !entry.target.dataset.counted) {
          entry.target.dataset.counted = 'true';
          animateCounter(entry.target, parseInt(entry.target.dataset.counter), 2000);
        }
      });
    }, { threshold: 0.5 });

    document.querySelectorAll('[data-counter]').forEach(el => counterObserver.observe(el));
  </script>
</body>

</html>
